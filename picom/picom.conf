backend = "glx";
vsync = true;

#################################
# BLUR (hyprland-like feel)
#################################
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = true;

#################################
# TRANSPARENCY
#################################
opacity-rule = [
  "80:class_g = 'code-oss'",
  "82:class_g = 'dev.zed.Zed'",
  "70:class_g = 'kitty'",
  "40:class_g = 'i3bar'",
  "60:class_g = 'Dunst'"
];

#################################
# ROUNDED CORNERS
#################################
corner-radius = 10;

rounded-corners-exclude = [
  "class_g = 'i3bar' && !_NET_WM_WINDOW_TYPE@",
];

#################################
# SHADOW (subtle, clean)
#################################
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.3;
shadow-offset-x = 0;
shadow-offset-y = 2;

#################################
# FADING (smooth like hyprland)
#################################
fading = true;
fade-in-step = 0.02;
fade-out-step = 0.02;
fade-delta = 5;
