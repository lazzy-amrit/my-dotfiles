# Font
font_family Cantarell
font_size 11

# Window look
window_padding_width 10

# Transparency
background_opacity 0.70

# Blur (needs compositor like picom or hyprland blur support)
# kitty itself doesn’t blur — this is handled outside kitty

# Smoothness
disable_ligatures never
enable_audio_bell no

# Cursor feel
cursor_blink_interval 0.5

# Tabs (kept minimal)
tab_bar_edge bottom
tab_bar_style powerline